<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Deadline app icon: a soft calendar tile with a cherry blossom, on a lofi dusk sky.
       The rounded square follows the macOS icon grid (824px body on a 1024px canvas);
       scripts/icons.mjs crops to viewBox "100 100 824 824" for Windows/Linux sizes. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5F8FD0"/>
      <stop offset="0.55" stop-color="#9DB9E4"/>
      <stop offset="1" stop-color="#F6C9D8"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8DBF9A"/>
      <stop offset="1" stop-color="#6FA88A"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F08AA4"/>
      <stop offset="1" stop-color="#E06F8E"/>
    </linearGradient>
    <radialGradient id="petal" cx="0" cy="0" r="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F27FA0"/>
      <stop offset="0.45" stop-color="#F9B3C8"/>
      <stop offset="1" stop-color="#FFE3EC"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="18" result="b"/>
      <feFlood flood-color="#2B3F6B" flood-opacity="0.28"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <path id="p" d="M0 0 C-58 -26 -74 -112 -34 -158 C-22 -170 -10 -162 0 -146 C10 -162 22 -170 34 -158 C74 -112 58 -26 0 0 Z"/>
    <path id="mini" d="M0 0 C-14 -6 -18 -27 -8 -38 C-5 -41 -2 -39 0 -35 C2 -39 5 -41 8 -38 C18 -27 14 -6 0 0 Z"/>
  </defs>

  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sky)"/>
    <g filter="url(#soft)" fill="#FFFFFF">
      <ellipse cx="300" cy="300" rx="150" ry="46" opacity="0.38"/>
      <ellipse cx="760" cy="240" rx="120" ry="34" opacity="0.3"/>
    </g>
    <path d="M100 840 C260 760 400 790 520 820 C650 852 790 790 924 760 L924 924 L100 924 Z" fill="url(#hill)"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="252" y="270" width="520" height="500" rx="78" fill="#FFF9F5"/>
    <path d="M252 348 a78 78 0 0 1 78 -78 h364 a78 78 0 0 1 78 78 v52 h-520 Z" fill="url(#band)"/>
    <rect x="356" y="236" width="28" height="84" rx="14" fill="#5A6A8C"/>
    <rect x="640" y="236" width="28" height="84" rx="14" fill="#5A6A8C"/>
  </g>

  <g transform="translate(512 588)">
    <use href="#p" fill="url(#petal)"/>
    <use href="#p" fill="url(#petal)" transform="rotate(72)"/>
    <use href="#p" fill="url(#petal)" transform="rotate(144)"/>
    <use href="#p" fill="url(#petal)" transform="rotate(216)"/>
    <use href="#p" fill="url(#petal)" transform="rotate(288)"/>
    <circle r="30" fill="#E2577C"/>
    <g fill="#F6C66B">
      <circle cx="0" cy="-52" r="9"/><circle cx="49" cy="-16" r="9"/><circle cx="30" cy="42" r="9"/>
      <circle cx="-30" cy="42" r="9"/><circle cx="-49" cy="-16" r="9"/>
    </g>
    <g stroke="#E2577C" stroke-width="6" stroke-linecap="round">
      <line x1="0" y1="-28" x2="0" y2="-44"/><line x1="27" y1="-9" x2="41" y2="-13"/><line x1="17" y1="23" x2="25" y2="35"/>
      <line x1="-17" y1="23" x2="-25" y2="35"/><line x1="-27" y1="-9" x2="-41" y2="-13"/>
    </g>
  </g>

  <use href="#mini" fill="#FFD6E3" transform="translate(812 412) rotate(38) scale(1.25)"/>
  <use href="#mini" fill="#FBC1D3" transform="translate(196 520) rotate(-28)"/>
  <use href="#mini" fill="#FFE4EC" transform="translate(842 560) rotate(112) scale(0.85)"/>
</svg>
