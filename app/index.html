  // ---------- accounts (only when config.js turns them on; the client and sync are in src/account.js) ----------
  // The list renders from what's saved on the device first; the account script and the server catch up after.
  const acctReady = ACCOUNTS ? loadScript("src/account.js").then(() => window.DeadlineAccount || null, () => null) : Promise.resolve(null);
  const HINT_KEY = "deadline.hint.sync";
  let staleView = false;   // a synced change came in while a dialog was open: re-render when it closes
  let hintHidden = false;
  function accountHooks() {
    return {
      store,
      // the server had newer changes (from another device): show them
      onRemote(state, id) {
        if (id !== acctUid) return;
        S = normalize(state);
        if (!S.name) S.name = sessionName();
        if (document.querySelector(".overlay")) staleView = true; else render();
      },
      onStatus: paintSync,
      // this device now has the account's latest list: the held-back automatic updates can run
      onFresh(id) { if (id === acctUid) nowFresh(); },
      // the display name changed on the account (another device): mirror it into the list
      onSession(s, old) {
        const dn = s && s.user && s.user.display_name;
        if (!acctUid || s.user.id !== acctUid || !dn || (old && old.user.display_name === dn) || S.name === dn) return;
        S.name = dn; save(); softRender();
      },
      onSignedOut: leaveAccount,
    };
  }
  function syncLine() {
    const st = account ? account.status() : null;
    if (!st) return ["Can’t reach the server right now", "quiet"];
    if (st.state === "offline" || navigator.onLine === false) return ["Offline — will sync when you’re back online", "quiet"];
    if (st.state === "error") return [st.error, "bad"];
    if (st.state === "syncing") return ["Syncing…", "quiet"];
    if (st.dirty) return ["Waiting to sync…", "quiet"];
    if (!st.at) return ["Checking for changes…", "quiet"];
    const m = Math.floor((Date.now() - st.at) / 60000);
    return [m < 1 ? "Synced just now" : m < 60 ? `Synced ${plural(m, "minute", "minutes")} ago` : `Synced at ${new Date(st.at).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })}`, "good"];
  }
  function paintSync() {
    const el = document.getElementById("syncState"); if (!el) return;
    const [text, cls] = syncLine();
    el.textContent = text; el.className = "status " + cls;
  }

  // A form's one error line: right under the field it's about (that field marked invalid and focused, so a
  // phone keyboard can't hide the message far below it), else in its usual place above the buttons.
  function fieldErrors(form, err) {
    const parent = err.parentNode, home = err.nextSibling;
    let marked = null;
    function clear() {
      err.textContent = "";
      if (err.parentNode !== parent || err.nextSibling !== home) parent.insertBefore(err, home);
      if (!marked) return;
      marked.removeAttribute("aria-invalid");
      if (marked.dataset.desc) marked.setAttribute("aria-describedby", marked.dataset.desc); else marked.removeAttribute("aria-describedby");
      marked = null;
    }
    function show(msg, sel) {
      clear();
      const input = sel ? form.querySelector(sel) : null;
      if (input) {
        marked = input;
        input.dataset.desc = input.getAttribute("aria-describedby") || "";
        input.setAttribute("aria-invalid", "true");
        input.setAttribute("aria-describedby", `${input.dataset.desc} ${err.id}`.trim());
        input.after(err);
      }
      err.textContent = msg;
      if (input) input.focus();
      // the bottom field's message can land just under the fold (or the keyboard): bring it into view
      if (err.scrollIntoView) err.scrollIntoView({ block: "nearest" });
    }
    form.addEventListener("input", e => { if (marked && e.target === marked) clear(); });
    return { show, clear };
  }

  // Sign in / Create account: a two-option switch over one form (the welcome card, or a dialog for a guest)
  const USER_ATTRS = 'autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="24"';
  function authBlock() {
    const tab = (v, label) => `<button type="button" class="tab" role="tab" data-auth="${v}" aria-selected="${ui.auth === v}" aria-controls="authBody">${label}</button>`;
    return `

  function authForm() {

        <div class="field"><label for="auName">Display name</label><input id="auName" name="nickname" autocomplete="nickname" maxlength="40" aria-describedby="auNameNote"><span class="note" id="auNameNote">What Deadline calls you, like your first name.</span></div>
        <div class="field"><label for="auPass">Password</label><input id="auPass" name="new-password" type="password" autocomplete="new-password" aria-describedby="auPassNote"><span class="note" id="auPassNote">At least ${MIN_PW} characters.</span></div>
        <div class="field"><label for="auPass2">Confirm password</label><input id="auPass2" name="confirm-password" type="password" autocomplete="new-password"></div>
        <p class="note" style="margin:0">There’s no way to reset a forgotten password, so pick one you’ll remember or save it in your phone’s passwords.</p>
        <div class="err" id="auErr" role="alert"></div>

  function wireAuth(scope, onIn) {
    const q = s => scope.querySelector(s);
    scope.querySelectorAll("[data-auth]").forEach(b => b.onclick = () => {
      if (ui.auth === b.dataset.auth) return;
      const typed = q("#auUser").value;
      ui.auth = b.dataset.auth;
      scope.querySelectorAll("[data-auth]").forEach(x => x.setAttribute("aria-selected", String(x === b)));
      q("#authBody").innerHTML = authForm();
      q("#auUser").value = typed;
      placeInd(q("#authTabs"), q("#authInd"));

    });
    function wireForm() {
      const go = q("#auGo"), errs = fieldErrors(q("#authForm"), q("#auErr"));
      const val = s => (q(s) || { value: "" }).value;
      const fail = (msg, field) => errs.show(msg, field);
      q("#authForm").onsubmit = async e => {
        e.preventDefault();
        if (go.disabled) return;
        errs.clear();
        const creating = ui.auth === "new";
        const username = val("#auUser").trim(), password = val("#auPass"), name = val("#auName").trim();
        const A = await acctReady;
        if (creating) {
          const bad = A ? A.checkUsername(username) : "";
          if (bad) return fail(bad, "#auUser");
          if (!name) return fail("Add a display name, like your first name.", "#auName");
          const weak = A ? A.checkPassword(password) : password.length < MIN_PW ? `Your password needs at least ${MIN_PW} characters.` : "";
          if (weak) return fail(weak, "#auPass");
          if (password !== val("#auPass2")) return fail("The two passwords don’t match. Type the same one twice.", "#auPass2");
        } else {
          if (!username) return fail("Enter your username.", "#auUser");
          if (!password) return fail("Enter your password.", "#auPass");
        }
        if (!A || !account) return fail("Can’t reach the server. Check your internet connection and try again.");
        const label = go.textContent;
        go.disabled = true; go.textContent = creating ? "Creating your account…" : "Signing in…";
        try {
          const s = creating ? await account.signUp({ username, displayName: name, password }) : await account.signIn({ username, password });
          await onIn(s, creating);
        } catch (x) {
          if (!go.isConnected) return;
          go.disabled = false; go.textContent = label;
          fail(A.friendly(x), x && x.error_code === "user_already_exists" ? "#auUser" : null);
        }
      };
    }
    wireForm();
  }
  function renderAuthWelcome(fromApp) {

  function syncHint() {
    if (!ACCOUNTS || acctUid || hintHidden) return "";

    return `<p class="trash-note sync-hint panel-glass" data-glass="panel"><span>Want this list on your phone and laptop?</span> <button class="linkish" id="hintGo">Create an account or sign in</button> <button class="btn small ghost" id="hintOff">Not now</button></p>`;
  }
  function wireHint(panel) {

  // the guest list (deadline.v1), if this device has one
  function guestData() {
    let g = memory;
    try { const raw = localStorage.getItem(KEY); if (raw) g = normalize(JSON.parse(raw)); } catch (e) {}
    return g && (g.name || g.items.length) ? g : null;
  }
  // the guest list went into the account: keep a copy under deadline.v1.backup, then clear it
  function backupGuest() {

  }
  // Signed in (or just created): load the account's list, merging in anything this device still had
  // unsynced from an earlier session, then show it. A new account starts with this device's guest list.
  async function enterAccount(s, created, finish) {
    const A = window.DeadlineAccount, k = ACCT_PREFIX + s.user.id;
    let remote;
    try { remote = await account.fetchRow(); } catch (e) { account.forget(); throw e; }
    const old = store.get(k), guest = guestData();
    let rec;
    if (remote) rec = old && old.dirty && old.state ? { state: A.merge3(old.base, old.state, remote.state), base: remote.state, rev: remote.rev, dirty: true }
      : { state: remote.state, base: remote.state, rev: remote.rev, dirty: false };
    else rec = { state: old && old.state || { visits: 1, trashMigrated: true }, base: null, rev: 0, dirty: true };
    if (created && guest) { rec.state = A.mergeGuest(rec.state, guest); backupGuest(); }
    const st = normalize(rec.state);
    st.name = s.user.display_name || st.name || s.user.username;
    if (A.canon(st) !== A.canon(rec.state)) rec.dirty = true;
    rec.state = st;
    store.set(k, rec);
    acctUid = s.user.id; S = st; staleView = false;
    exitSelect(); ui.tab = "list"; ui.open = null; ui.guestName = false;
    nowFresh();   // the list was just fetched
    account.start(true);
    await finish();
    if (programs.length) applyPrograms();
    toast(created ? "Account created. Your deadlines now sync to every device you sign in on." : `Signed in as @${s.user.username}`);
    if (!created && guest && guest.items.length) {
      if (motionOK()) await new Promise(r => setTimeout(r, 300));   // let the sign-in dialog finish leaving
      await askImport(guest);
    }
  }
  async function askImport(guest) {
    const n = guest.items.length;
    const ok = await confirmDialog({
      title: `Add the ${plural(n, "deadline", "deadlines")} saved on this device to your account?`,
      lines: guest.items.map(i => i.title + (i.due ? ` · ${longDate(i.due)}` : "")),
      note: "Yes puts them on your list on every device you sign in on. No leaves them on this device only, for when you use Deadline without an account.",
      confirmLabel: "Yes, add them", cancelLabel: "No", tone: "accent", icon: "",
    });
    if (!ok || !acctUid) return;
    const before = S.items.length;
    S = normalize(window.DeadlineAccount.mergeGuest(S, guest));
    save(); backupGuest(); render();
    const added = S.items.length - before;
    toast(added ? `Added ${plural(added, "deadline", "deadlines")} to your account` : "Those deadlines were already in your account");
  }
  // back to this device's own list (or the welcome) after signing out here, in another tab, or because the
  // session ended. Nothing of the account stays behind for the next person on a shared device: not the guest
  // list it was made from (deadline.v1.backup), and not the laptop's Canvas connection (it belongs to this
  // computer, not to the account, so the next student would get this one's assignments).
  function leaveAccount(msg) {
    if (account) account.stop();
    if (document.querySelector(".overlay")) document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape" }));
    acctUid = null; staleView = false;
    waiting.length = 0; listFresh = true;
    try { localStorage.removeItem(KEY + ".backup"); } catch (e) {}
    const canvasOff = !!(desk && deskStatus && deskStatus.connected);
    if (desk) { desk.canvas.disconnect().catch(() => {}); deskStatus = { connected: false }; deskBusy = false; }
    S = load();
    exitSelect(); ui.tab = "list"; ui.open = null; ui.guestName = false;
    render();
    if (msg) toast(canvasOff ? `${msg.replace(/\.$/, "")}. Canvas is disconnected on this computer.` : msg);
  }
  async function signOutFlow() {
    if (!account || !acctUid) return;
    const who = acctUid;
    if (account.isDirty()) {
      toast("Syncing your changes before you sign out…");
      await Promise.race([account.syncNow(), new Promise(r => setTimeout(r, 5000))]);
      if (acctUid !== who) return;   // signed out meanwhile (another tab)
    }
    if (account.isDirty()) {
      document.querySelectorAll(".toast").forEach(t => t.remove());
      const ok = await confirmDialog({
        title: "Sign out?", lines: [],
        note: "These changes haven’t synced yet. If you sign out now, they’re gone from this device and never reach your account. Get back online first to keep them.",
        confirmLabel: "Sign out anyway", icon: "",
      });
      if (!ok || acctUid !== who) return;
    }
    // the session and the account's list leave the device at once; the server hears about it in the background
    account.signOut();
    leaveAccount("Signed out");
  }
  // another tab signed in, out, or into a different account
  function sessionElsewhere() {
    const s = sessionNow(), id = s ? s.user.id : null;
    if (id === acctUid) return;
    if (!id) return leaveAccount("Signed out in another tab");
    if (account) account.stop();
    if (document.querySelector(".overlay")) document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape" }));
    acctUid = id; S = load(); staleView = false;
    waiting.length = 0; listFresh = false;
    if (programs.length) whenFresh(applyPrograms);
    exitSelect(); ui.tab = "list"; ui.open = null;
    render();
    if (account) account.start();
  }

  // another open copy of the app saved changes: load them instead of overwriting them later
  window.addEventListener("storage", e => {
    if (ACCOUNTS && e.key === SESSION_KEY) return sessionElsewhere();
    if (e.key !== stateKey() || !e.newValue) return;
    try {
      const v = JSON.parse(e.newValue), next = acctUid ? v.state : v;
      if (!next || JSON.stringify(next) === JSON.stringify(S)) return;
      S = normalize(next);
      if (!document.querySelector(".overlay")) render(); else staleView = true;
    } catch (_) {}
  });

  // Lists saved here for an account that isn't signed in: changes kept when a session ended before they
  // synced go after KEPT_DAYS; anything else for another account shouldn't be on this device at all.
  const KEPT_DAYS = 14;
  function sweepAccounts() {
    try {
      for (let i = localStorage.length - 1; i >= 0; i--) {
        const k = localStorage.key(i);
        if (!k || !k.startsWith(ACCT_PREFIX) || k === ACCT_PREFIX + acctUid) continue;
        const rec = store.get(k);
        if (!rec || !rec.keptAt || Date.now() - rec.keptAt > KEPT_DAYS * DAY) store.remove(k);
      }
    } catch (e) {}
  }

  // ---------- boot ----------
  if (ACCOUNTS) sweepAccounts();
  migrateTrash();
  purgeExpired();
  if (S.name) { S.visits = (S.visits || 0) + 1; save(); }
  root.classList.add("intro");
  const scene = startScene(); // decides WebGL vs CSS glass once the engine script is in
  render();
  loadPrograms();
  scene.then(beginIntro, beginIntro);
  setTimeout(beginIntro, 1400);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeIndicator);
  if (desk) desk.canvas.status().then(st => {
    deskStatus = st || { connected: false };
    if (deskStatus.connected) whenFresh(deskLaunchSync); else if (ui.tab === "canvas") softRender();
  }).catch(() => {});
  acctReady.then(A => {
    if (!A) { nowFresh(); return; }   // no sync this time: nothing to wait for
    account = A.create(CFG, accountHooks());
    if (acctUid) account.start();
  });
})();
</script>
